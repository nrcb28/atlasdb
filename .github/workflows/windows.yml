name: Windows C#
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile original C engine for Windows
        shell: pwsh
        run: ./windows/build-native.ps1 -Gcc "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\gcc.exe"
      - name: Build C# and run managed/native integration checks
        shell: pwsh
        run: |
          dotnet build windows/AtlasDB.Cli -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/AtlasDB.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_frontend.py --dotnet dotnet --app windows/AtlasDB.Cli/bin/Release/net10.0/AtlasDB.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained application
        if: github.event_name == 'push'
        shell: pwsh
        run: ./windows/publish.ps1 -Gcc "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\gcc.exe"
      - name: Test packaged executable
        if: github.event_name == 'push'
        shell: pwsh
        run: python tests/windows_frontend.py --app build/windows-x64/AtlasDB.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: AtlasDB-Windows-x64
          path: build/windows-x64/
          if-no-files-found: error
